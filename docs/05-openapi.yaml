components:
  schemas:
    AccountSessionResponse:
      required:
        - status
        - verificationStatus
        - expiresAtUtc
      type: object
      properties:
        status:
          description: Always `signedIn` for a current browser session.
          $ref: "#/components/schemas/SessionStatus"
        verificationStatus:
          description: Current server-side account verification state.
          $ref: "#/components/schemas/SessionVerificationStatus"
        expiresAtUtc:
          type: string
          description: UTC expiry of the fixed eight-hour protected server ticket; the cookie itself is nonpersistent.
          format: date-time
    AntiforgeryTokenResponse:
      required:
        - requestToken
        - headerName
      type: object
      properties:
        requestToken:
          type: string
          description: Opaque request token. Send it only in the X-LinguaDesk-Antiforgery header with the matching antiforgery cookie.
        headerName:
          type: string
          description: Always `X-LinguaDesk-Antiforgery`.
    AuthMode:
      enum:
        - bearer
        - cookie
      type: string
      description: Credential mode that authenticated this call.
    BearerRefreshRequest:
      required:
        - refreshToken
        - accessToken
      type: object
      properties:
        refreshToken:
          minLength: 1
          type: string
          description: Write-only currently held opaque refresh token. Both held pair members are required.
          writeOnly: true
        accessToken:
          minLength: 1
          type: string
          description: Write-only currently held opaque access token. Both held pair members are required.
          writeOnly: true
    BearerSignInRequest:
      required:
        - email
        - password
      type: object
      properties:
        email:
          maxLength: 254
          type: string
          description: Local account email address. Maximum 254 Unicode scalar values; surrounding whitespace is invalid.
          format: email
        password:
          maxLength: 128
          minLength: 15
          type: string
          description: Write-only password containing 15 to 128 well-formed Unicode scalar values.
          format: password
          writeOnly: true
    BearerTokenPairResponse:
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - tokenType
        - verificationStatus
      type: object
      properties:
        accessToken:
          type: string
          description: "Opaque protected access token. Present it as `Authorization: Bearer ...`; it is never set as a cookie."
          writeOnly: true
        refreshToken:
          type: string
          description: Opaque protected refresh token used only with POST /api/accounts/bearer-refresh.
          writeOnly: true
        expiresIn:
          type: integer
          description: Access-token lifetime in seconds; always 900.
          format: int64
        tokenType:
          type: string
          description: Always `Bearer`.
        verificationStatus:
          description: Current server-side account verification state.
          $ref: "#/components/schemas/SessionVerificationStatus"
    CapabilitiesResponse:
      required:
        - serverTimeUtc
        - languages
        - sourceSelection
        - chineseScriptPolicy
        - countingPolicy
        - translation
        - rewriting
        - operationIdentity
      type: object
      properties:
        serverTimeUtc:
          type: string
          description: Current server time in UTC, used by clients when validating new UUIDv7 timestamps.
          format: date-time
        languages:
          type: array
          items:
            $ref: "#/components/schemas/LanguageCapability"
          description: Ordered supported language identifiers and English names.
        sourceSelection:
          description: Accepted source-language values and omission default.
          $ref: "#/components/schemas/SourceSelectionCapability"
        chineseScriptPolicy:
          description: Accepted Chinese input scripts and required Chinese output script.
          $ref: "#/components/schemas/ChineseScriptPolicyCapability"
        countingPolicy:
          description: Canonical decoded-input counting and local rejection policy.
          $ref: "#/components/schemas/CountingPolicyCapability"
        translation:
          description: Translation directions, whole-input limit, and overall deadline.
          $ref: "#/components/schemas/TranslationCapability"
        rewriting:
          description: Exclusive rewriting modes, whole-input limit, and overall deadline.
          $ref: "#/components/schemas/RewritingCapability"
        operationIdentity:
          description: UUIDv7 operation-identity recovery bounds.
          $ref: "#/components/schemas/OperationIdentityCapability"
    ChineseScript:
      enum:
        - simplified
        - traditional
      type: string
    ChineseScriptPolicyCapability:
      required:
        - acceptedInput
        - output
      type: object
      properties:
        acceptedInput:
          type: array
          items:
            $ref: "#/components/schemas/ChineseScript"
          description: Chinese scripts accepted as input.
        output:
          description: Chinese script used for output.
          $ref: "#/components/schemas/ChineseScript"
      description: Accepted Chinese input scripts and required Chinese output script.
    ConfirmationStatus:
      enum:
        - verified
      type: string
      description: Always `verified` after a successful or idempotently repeated confirmation.
    ConfirmEmailAccepted:
      required:
        - status
      type: object
      properties:
        status:
          description: Always `verified` after a successful or idempotently repeated confirmation.
          $ref: "#/components/schemas/ConfirmationStatus"
    ConfirmEmailRequest:
      required:
        - userId
        - code
      type: object
      properties:
        userId:
          maxLength: 450
          minLength: 1
          type: string
          description: Opaque local-account identifier delivered with the verification code. Maximum 450 characters.
        code:
          maxLength: 4096
          minLength: 1
          type: string
          description: Unpadded base64url encoding of the delivered email-confirmation token. Maximum 4096 characters.
          writeOnly: true
    CountingPolicyCapability:
      required:
        - id
        - unit
        - normalization
        - lineEndings
        - invalidUnicode
        - emptyOrWhitespace
        - whitespaceCodePointRanges
      type: object
      properties:
        id:
          type: string
          description: Versioned counting policy identifier.
        unit:
          description: Unit counted in exact decoded source text.
          $ref: "#/components/schemas/CountingUnit"
        normalization:
          description: Unicode normalization applied before counting; none for this policy.
          $ref: "#/components/schemas/NormalizationPolicy"
        lineEndings:
          description: Line-ending treatment before counting; exact line endings are preserved.
          $ref: "#/components/schemas/LineEndingPolicy"
        invalidUnicode:
          description: Disposition of isolated UTF-16 surrogates or malformed decoded Unicode.
          $ref: "#/components/schemas/InvalidUnicodePolicy"
        emptyOrWhitespace:
          description: Disposition of empty or fixed-set whitespace-only source.
          $ref: "#/components/schemas/EmptyOrWhitespacePolicy"
        whitespaceCodePointRanges:
          type: array
          items:
            type: string
          description: Inclusive Unicode code-point ranges used only for the all-whitespace decision.
      description: Canonical decoded-input counting and local rejection policy.
    CountingUnit:
      enum:
        - unicodeScalar
      type: string
      description: Unit counted in exact decoded source text.
    CurrentAccountResponse:
      required:
        - email
        - verificationStatus
        - authMode
      type: object
      properties:
        email:
          type: string
          description: Local account email address.
        verificationStatus:
          description: Current server-side account verification state.
          $ref: "#/components/schemas/SessionVerificationStatus"
        authMode:
          description: Credential mode that authenticated this call.
          $ref: "#/components/schemas/AuthMode"
    EmptyOrWhitespacePolicy:
      enum:
        - reject
      type: string
      description: Disposition of empty or fixed-set whitespace-only source.
    ForgotPasswordAccepted:
      required:
        - status
        - retryAfterSeconds
      type: object
      properties:
        status:
          description: Always `passwordResetRequested` for a syntactically valid request.
          $ref: "#/components/schemas/ForgotPasswordStatus"
        retryAfterSeconds:
          type: integer
          description: Fixed reset-delivery interval in seconds; it does not disclose account or cooldown state.
          format: int32
    ForgotPasswordRequest:
      required:
        - email
      type: object
      properties:
        email:
          maxLength: 254
          type: string
          description: Local account email address. Maximum 254 Unicode scalar values; surrounding whitespace is invalid.
          format: email
    ForgotPasswordStatus:
      enum:
        - passwordResetRequested
      type: string
      description: Always `passwordResetRequested` for a syntactically valid request.
    InvalidUnicodePolicy:
      enum:
        - reject
      type: string
      description: Disposition of isolated UTF-16 surrogates or malformed decoded Unicode.
    LanguageCapability:
      required:
        - id
        - name
      type: object
      properties:
        id:
          description: Stable language identifier.
          $ref: "#/components/schemas/LanguageId"
        name:
          type: string
          description: English display name.
    LanguageId:
      enum:
        - en
        - ru
        - ro
        - zh
      type: string
      description: Stable language identifier.
    LineEndingPolicy:
      enum:
        - preserve
      type: string
      description: Line-ending treatment before counting; exact line endings are preserved.
    NormalizationPolicy:
      enum:
        - none
      type: string
      description: Unicode normalization applied before counting; none for this policy.
    OperationFamily:
      enum:
        - translation
        - rewriting
      type: string
      description: Language operation family.
    OperationIdentityCapability:
      required:
        - format
        - validForSeconds
        - maximumFutureSkewSeconds
      type: object
      properties:
        format:
          description: Client-generated operation identity format.
          $ref: "#/components/schemas/OperationIdentityFormat"
        validForSeconds:
          type: integer
          description: Retry and status validity after the UUID embedded timestamp, in seconds.
          format: int32
        maximumFutureSkewSeconds:
          type: integer
          description: Maximum accepted future UUID timestamp skew, in seconds.
          format: int32
      description: UUIDv7 operation-identity recovery bounds.
    OperationIdentityFormat:
      enum:
        - uuidV7
      type: string
      description: Client-generated operation identity format.
    OperationPendingResponse:
      required:
        - operationId
        - family
        - status
        - characterCount
        - admissionDay
        - deadlineUtc
        - serverTimeUtc
        - usage
      type: object
      properties:
        operationId:
          type: string
          description: Operation identity echoed from the submission.
          format: uuid
        family:
          description: Language operation family.
          $ref: "#/components/schemas/OperationFamily"
        status:
          description: "Observed reservation state: `pending`."
          $ref: "#/components/schemas/OperationStatus"
        characterCount:
          type: integer
          description: Reserved Unicode scalar count charged on a later successful settlement.
          format: int32
        admissionDay:
          type: string
          description: UTC day owning the reservation, in yyyy-MM-dd form.
        deadlineUtc:
          type: string
          description: Server-controlled overall deadline for the operation.
          format: date-time
        serverTimeUtc:
          type: string
          description: Current server time in UTC.
          format: date-time
        usage:
          description: Fresh current-day user usage snapshot.
          $ref: "#/components/schemas/UsageSnapshot"
    OperationProblemDetails:
      required:
        - title
        - status
        - detail
        - category
        - correlationId
      type: object
      properties:
        type:
          type:
            - "null"
            - string
          description: RFC 9457 problem type reference.
        title:
          type: string
          description: Short, stable problem summary.
        status:
          type: integer
          description: HTTP status code for this occurrence.
          format: int32
        detail:
          type: string
          description: Safe explanation that never echoes submitted text.
        category:
          type: string
          description: LinguaDesk error category.
        correlationId:
          type: string
          description: Opaque request correlation identifier.
        serverTimeUtc:
          type:
            - "null"
            - string
          description: Current server time in UTC for identity and allowance recovery.
          format: date-time
        resetAtUtc:
          type:
            - "null"
            - string
          description: Next UTC midnight resetting both daily allowances; present for allowance denials.
          format: date-time
        reason:
          type:
            - "null"
            - string
          description: Machine-readable eligibility reason; present for input eligibility failures.
        characterCount:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          description: Submitted scalar count; present when safely countable.
          format: int32
        limit:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          description: Applicable character limit; present for oversize and allowance failures.
          format: int32
        errors:
          type:
            - "null"
            - object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field messages for structural request failures.
    OperationStatus:
      enum:
        - pending
        - succeeded
        - failed
        - interrupted
      type: string
      description: "Observed reservation state: `pending`."
    OperationStatusResponse:
      required:
        - operationId
        - family
        - status
        - characterCount
        - admissionDay
        - deadlineUtc
        - outputAvailable
        - serverTimeUtc
        - usage
      type: object
      properties:
        operationId:
          type: string
          description: Operation identity echoed from the submission.
          format: uuid
        family:
          description: Language operation family.
          $ref: "#/components/schemas/OperationFamily"
        status:
          description: "Observed operation state: `pending`, `succeeded`, `failed` or `interrupted`."
          $ref: "#/components/schemas/OperationStatus"
        characterCount:
          type: integer
          description: Reserved count while pending, committed charge when succeeded, zero when failed or interrupted.
          format: int32
        admissionDay:
          type: string
          description: UTC day owning the reservation or charge, in yyyy-MM-dd form.
        deadlineUtc:
          type: string
          description: Server-controlled overall deadline for the operation.
          format: date-time
        outputAvailable:
          type: boolean
          description: "Always false in this slice: status reads never carry result text."
        serverTimeUtc:
          type: string
          description: Current server time in UTC.
          format: date-time
        usage:
          description: Fresh current-day user usage snapshot.
          $ref: "#/components/schemas/UsageSnapshot"
    OversizeHandling:
      enum:
        - rejectWhole
      type: string
      description: Whole-input behavior when the source exceeds the maximum.
    RecoveryProblemDetails:
      required:
        - title
        - status
        - detail
        - category
        - correlationId
      type: object
      properties:
        type:
          type:
            - "null"
            - string
          description: RFC 9457 problem type reference.
        title:
          type: string
          description: Short, stable problem summary.
        status:
          type: integer
          description: HTTP status code for this occurrence.
          format: int32
        detail:
          type: string
          description: Safe explanation that never echoes submitted account, token or password values.
        category:
          type: string
          description: "LinguaDesk error category: `invalidRequest`, `invalidOrExpiredPasswordReset`, or `availability`."
        correlationId:
          type: string
          description: Opaque request correlation identifier.
        errors:
          type:
            - "null"
            - object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field messages keyed only by `email` or `newPassword`; present for field validation failures.
    RegistrationAccepted:
      required:
        - status
      type: object
      properties:
        status:
          description: Always `verificationRequired` for an accepted new or existing normalized email.
          $ref: "#/components/schemas/RegistrationStatus"
    RegistrationProblemDetails:
      required:
        - title
        - status
        - detail
        - category
        - correlationId
      type: object
      properties:
        type:
          type:
            - "null"
            - string
          description: RFC 9457 problem type reference.
        title:
          type: string
          description: Short, stable problem summary.
        status:
          type: integer
          description: HTTP status code for this occurrence.
          format: int32
        detail:
          type: string
          description: Safe explanation that never echoes submitted account values.
        category:
          type: string
          description: "LinguaDesk error category: `invalidRequest` or `availability`."
        correlationId:
          type: string
          description: Opaque request correlation identifier.
        errors:
          type:
            - "null"
            - object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field messages keyed only by `email` or `password`; present for field validation failures.
    RegistrationRequest:
      required:
        - email
        - password
      type: object
      properties:
        email:
          maxLength: 254
          type: string
          description: Local account email address. Maximum 254 Unicode scalar values; surrounding whitespace is invalid.
          format: email
        password:
          maxLength: 128
          minLength: 15
          type: string
          description: Write-only password containing 15 to 128 well-formed Unicode scalar values.
          format: password
          writeOnly: true
    RegistrationStatus:
      enum:
        - verificationRequired
      type: string
      description: Always `verificationRequired` for an accepted new or existing normalized email.
    ResendVerificationAccepted:
      required:
        - status
        - retryAfterSeconds
      type: object
      properties:
        status:
          description: Always `verificationRequested` for a syntactically valid request.
          $ref: "#/components/schemas/ResendVerificationStatus"
        retryAfterSeconds:
          type: integer
          description: Fixed resend interval in seconds; it does not disclose account or cooldown state.
          format: int32
    ResendVerificationRequest:
      required:
        - email
      type: object
      properties:
        email:
          maxLength: 254
          type: string
          description: Local account email address. Maximum 254 Unicode scalar values; surrounding whitespace is invalid.
          format: email
    ResendVerificationStatus:
      enum:
        - verificationRequested
      type: string
      description: Always `verificationRequested` for a syntactically valid request.
    ResetPasswordAccepted:
      required:
        - status
      type: object
      properties:
        status:
          description: Always `passwordReset` after a successful password reset.
          $ref: "#/components/schemas/ResetPasswordStatus"
    ResetPasswordRequest:
      required:
        - userId
        - code
        - newPassword
      type: object
      properties:
        userId:
          maxLength: 450
          minLength: 1
          type: string
          description: Opaque local-account identifier delivered with the reset code. Maximum 450 characters.
        code:
          maxLength: 4096
          minLength: 1
          type: string
          description: Unpadded base64url encoding of the delivered password-reset token. Maximum 4096 characters.
          writeOnly: true
        newPassword:
          maxLength: 128
          minLength: 15
          type: string
          description: Write-only replacement password containing 15 to 128 well-formed Unicode scalar values.
          format: password
          writeOnly: true
    ResetPasswordStatus:
      enum:
        - passwordReset
      type: string
      description: Always `passwordReset` after a successful password reset.
    RewritingCapability:
      required:
        - maximumSourceCharacters
        - oversizeHandling
        - overallDeadlineSeconds
        - defaultMode
        - modes
      type: object
      properties:
        maximumSourceCharacters:
          type: integer
          description: Maximum complete decoded source in Unicode scalar values.
          format: int32
        oversizeHandling:
          description: Whole-input behavior when the source exceeds the maximum.
          $ref: "#/components/schemas/OversizeHandling"
        overallDeadlineSeconds:
          type: integer
          description: Overall server deadline including eligibility and fallback attempts.
          format: int32
        defaultMode:
          description: Writing mode used when a client omits the mode.
          $ref: "#/components/schemas/RewritingModeId"
        modes:
          type: array
          items:
            $ref: "#/components/schemas/RewritingModeCapability"
          description: Ordered mutually exclusive rewriting choices; correction applies to every choice.
      description: Exclusive rewriting modes, whole-input limit, and overall deadline.
    RewritingModeCapability:
      required:
        - id
        - name
        - kind
      type: object
      properties:
        id:
          description: Stable writing-mode identifier.
          $ref: "#/components/schemas/RewritingModeId"
        name:
          type: string
          description: English display name.
        kind:
          description: Correction, writing-style, or tone category.
          $ref: "#/components/schemas/RewritingModeKind"
    RewritingModeId:
      enum:
        - correctionOnly
        - simple
        - casual
        - business
        - academic
        - enthusiastic
        - friendly
        - confident
        - diplomatic
      type: string
      description: Writing mode used when a client omits the mode.
    RewritingModeKind:
      enum:
        - correction
        - style
        - tone
      type: string
      description: Correction, writing-style, or tone category.
    SessionProblemDetails:
      required:
        - title
        - status
        - detail
        - category
        - correlationId
      type: object
      properties:
        type:
          type:
            - "null"
            - string
          description: RFC 9457 problem type reference.
        title:
          type: string
          description: Short, stable problem summary.
        status:
          type: integer
          description: HTTP status code for this occurrence.
          format: int32
        detail:
          type: string
          description: Safe explanation that never echoes account or authentication values.
        category:
          type: string
          description: LinguaDesk error category.
        correlationId:
          type: string
          description: Opaque request correlation identifier.
        errors:
          type:
            - "null"
            - object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field messages keyed only by `email` or `password`.
    SessionStatus:
      enum:
        - signedIn
      type: string
      description: Always `signedIn` for a current browser session.
    SessionVerificationStatus:
      enum:
        - verified
        - verificationRequired
      type: string
      description: Current server-side account verification state.
    SignInRequest:
      required:
        - email
        - password
      type: object
      properties:
        email:
          maxLength: 254
          type: string
          description: Local account email address. Maximum 254 Unicode scalar values; surrounding whitespace is invalid.
          format: email
        password:
          maxLength: 128
          minLength: 15
          type: string
          description: Write-only password containing 15 to 128 well-formed Unicode scalar values.
          format: password
          writeOnly: true
    SourceSelectionCapability:
      required:
        - default
        - values
      type: object
      properties:
        default:
          description: Source selection used when a client omits the setting.
          $ref: "#/components/schemas/SourceSelectionValue"
        values:
          type: array
          items:
            $ref: "#/components/schemas/SourceSelectionValue"
          description: Ordered accepted automatic and manual source selections.
      description: Accepted source-language values and omission default.
    SourceSelectionValue:
      enum:
        - auto
        - en
        - ru
        - ro
        - zh
      type: string
      description: Source selection used when a client omits the setting.
    SubmitOperationRequest:
      required:
        - operationId
        - family
        - source
      type: object
      properties:
        operationId:
          type: string
          description: Client-generated UUIDv7 operation identity, unique within the account across both families.
          format: uuid
        family:
          description: "Language operation family: `translation` or `rewriting`."
          $ref: "#/components/schemas/OperationFamily"
        source:
          maxLength: 5000
          minLength: 1
          type: string
          description: Exact decoded full source text; line endings are significant and preserved.
        sourceSelection:
          type:
            - "null"
            - string
          description: Effective source selection; `auto` when omitted.
        target:
          type:
            - "null"
            - string
          description: Required translation target language; absent for rewriting.
        mode:
          type:
            - "null"
            - string
          description: Rewriting mode; the catalog default when omitted; absent for translation.
    TranslationCapability:
      required:
        - maximumSourceCharacters
        - oversizeHandling
        - overallDeadlineSeconds
        - targetRequired
        - supportedDirections
      type: object
      properties:
        maximumSourceCharacters:
          type: integer
          description: Maximum complete decoded source in Unicode scalar values.
          format: int32
        oversizeHandling:
          description: Whole-input behavior when the source exceeds the maximum.
          $ref: "#/components/schemas/OversizeHandling"
        overallDeadlineSeconds:
          type: integer
          description: Overall server deadline including eligibility and fallback attempts.
          format: int32
        targetRequired:
          type: boolean
          description: Whether the client must explicitly select a translation target.
        supportedDirections:
          type: array
          items:
            $ref: "#/components/schemas/TranslationDirectionCapability"
          description: Ordered supported distinct source-to-target language pairs.
      description: Translation directions, whole-input limit, and overall deadline.
    TranslationDirectionCapability:
      required:
        - source
        - target
      type: object
      properties:
        source:
          description: Translation source language.
          $ref: "#/components/schemas/LanguageId"
        target:
          description: Translation target language.
          $ref: "#/components/schemas/LanguageId"
    UsageAvailability:
      enum:
        - available
        - user-exhausted
        - service-exhausted
        - monetary-suspended
        - unavailable
      type: string
      description: "Categorical availability: `available`, `user-exhausted`, `service-exhausted`, `monetary-suspended` or `unavailable`."
    UsageSnapshot:
      required:
        - day
        - resetAtUtc
        - consumedCharacters
        - reservedCharacters
        - allowanceCharacters
        - availableCharacters
        - revision
        - availability
      type: object
      properties:
        day:
          type: string
          description: UTC day described by this snapshot, in yyyy-MM-dd form.
        resetAtUtc:
          type: string
          description: Next UTC midnight resetting both daily allowances.
          format: date-time
        consumedCharacters:
          type: integer
          description: Characters consumed by settled successes on this day.
          format: int32
        reservedCharacters:
          type: integer
          description: Characters currently reserved by pending operations on this day.
          format: int32
        allowanceCharacters:
          type: integer
          description: Configured user daily character allowance.
          format: int32
        availableCharacters:
          type: integer
          description: Nonnegative remaining reservable characters.
          format: int32
        revision:
          type: integer
          description: Durable monotonically increasing snapshot revision.
          format: int64
        availability:
          description: "Categorical availability: `available`, `user-exhausted`, `service-exhausted`, `monetary-suspended` or `unavailable`."
          $ref: "#/components/schemas/UsageAvailability"
      description: Fresh current-day user usage snapshot.
    VerificationProblemDetails:
      required:
        - title
        - status
        - detail
        - category
        - correlationId
      type: object
      properties:
        type:
          type:
            - "null"
            - string
          description: RFC 9457 problem type reference.
        title:
          type: string
          description: Short, stable problem summary.
        status:
          type: integer
          description: HTTP status code for this occurrence.
          format: int32
        detail:
          type: string
          description: Safe explanation that never echoes submitted account or verification values.
        category:
          type: string
          description: "LinguaDesk error category: `invalidRequest`, `invalidOrExpiredVerification`, or `availability`."
        correlationId:
          type: string
          description: Opaque request correlation identifier.
        errors:
          type:
            - "null"
            - object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field messages keyed only by `email`, `userId`, or `code`; present for field validation failures.
  securitySchemes:
    sessionCookie:
      type: apiKey
      description: Secure, HttpOnly, SameSite=Lax, host-scoped nonpersistent browser session cookie.
      name: __Host-LinguaDesk.Session
      in: cookie
    antiforgeryHeader:
      type: apiKey
      description: Opaque request token paired with the Secure, HttpOnly, SameSite=Strict __Host-LinguaDesk.Antiforgery cookie.
      name: X-LinguaDesk-Antiforgery
      in: header
    antiforgeryCookie:
      type: apiKey
      description: Secure, HttpOnly, SameSite=Strict host-scoped cookie paired with X-LinguaDesk-Antiforgery.
      name: __Host-LinguaDesk.Antiforgery
      in: cookie
    bearerAuth:
      type: http
      description: "Opaque ASP.NET Core Identity bearer access token presented as `Authorization: Bearer ...`. Tokens are never set as cookies or persisted by browser JavaScript."
      scheme: bearer
tags:
  - name: CapabilitiesEndpoints
  - name: OperationsEndpoints
  - name: RegistrationEndpoints
  - name: VerificationEndpoints
  - name: RecoveryEndpoints
  - name: SessionEndpoints
  - name: BearerEndpoints
