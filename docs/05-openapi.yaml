paths:
  /api/capabilities:
    get:
      tags:
        - CapabilitiesEndpoints
      summary: Get accepted language and input capabilities
      description: Returns public catalog, input-counting, whole-input limit, deadline, and retry-identity metadata. The catalog does not imply that language-operation, account, usage, or status endpoints are implemented.
      operationId: getCapabilities
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: Always `no-store` because the response includes current server time.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
  /api/accounts/register:
    post:
      tags:
        - RegistrationEndpoints
      summary: Register a local account
      description: Creates an unverified local account when the normalized email is new and always returns the same verification-required acknowledgment for a valid duplicate. No authentication credential is issued.
      operationId: registerLocalAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
        required: true
      responses:
        "202":
          description: Accepted
          headers:
            Cache-Control:
              description: Always `no-store` for registration responses.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationAccepted"
        "400":
          description: Bad Request
          headers:
            Cache-Control:
              description: Always `no-store` for registration responses.
              required: true
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RegistrationProblemDetails"
        "415":
          description: Unsupported Media Type
          headers:
            Cache-Control:
              description: Always `no-store` for registration responses.
              required: true
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RegistrationProblemDetails"
        "503":
          description: Service Unavailable
          headers:
            Cache-Control:
              description: Always `no-store` for registration responses.
              required: true
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RegistrationProblemDetails"
